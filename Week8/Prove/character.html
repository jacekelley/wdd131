<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Michael the Hero">
    <meta property="og:description" content="Character card project for WDD 131.">
    <meta property="og:image" content="michael.png">
    <meta property="og:type" content="website">

    <title>Character Card</title>
    <link rel="icon" href="swords.webp">
    <link rel="stylesheet" href="character.css">
</head>

<body>
    <div class="card">
        <h1><span id="name" aria-label="Character Name"></span></h1>
        <p>Class: <span id="class" aria-label="Class Type"></span></p>
        <p>Level: <span id="level" aria-label="Character Level"></span></p>
        <p>Health: <span id="health" aria-label="Health"></span> / <span id="maxhealth"></span></p>

        <img alt="Michael" id="characterimage" aria-label="Character Picture">

        <button onclick="character.attacked()" aria-label="Attack character button">Attacked</button>
        <button onclick="character.levelup()" aria-label="Level up character button">Level</button>
        <button onclick="character.heal()" aria-label="Heal character button">Heal</button>
    </div>
</body>
<script src="character.js"></script>

</html>
