<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelda Quiz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="images/triforce.webp">
</head>

<body>
    <div id="wrapper">

        <header>
            <img src="images/triforce.webp" alt="Triforce Logo" class="logo">
            <h1>Zelda Adventure Quiz</h1>
        </header>

        <div id="hero">
            <img src="images/zelda_hero.jpg" alt="Hero Image">
        </div>

        <div id="welcome">
            <p>Welcome to the Zelda Adventure Quiz! Test your skills and help the hero on his quest! Gain hearts by
                answering questions correctly, but beware losing them!</p>
            <img src="images/pixel_hearts.png" alt="Pixel Hearts">
        </div>
    </div>

</body>

</html>
